name: Release

# Publishes to npm when the owner publishes a GitHub release. npm trusted
# publishing authenticates this workflow through OIDC, so no npm token is
# stored anywhere. The trusted publisher on npmjs.com must name this file.
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check the release tag matches package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package.json version v$version." >&2
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Use an npm that supports trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            npm install --global "npm@11.19.1"
          fi
          npm --version
      - name: Install locked dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci
      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
