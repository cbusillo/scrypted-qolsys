---
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 30
    schedule:
      interval: weekly
    groups:
      all-version-updates:
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/src"
    # Keep the floor at the oldest supported qolsys-controller release.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 30
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      all-version-updates:
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
